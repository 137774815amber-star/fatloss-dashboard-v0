<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40天健康体态管理 · 数据仪表盘</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink: #3f3438;
            --muted: #7b6f73;
            --rose: #ff9aa2;
            --rose-deep: #e56f86;
            --peach: #ffdac1;
            --cream: #fff4c7;
            --mint: #b5ead7;
            --sky: #c7ceea;
            --lavender: #d7c0e8;
            --card: rgba(255, 255, 255, 0.94);
            --line: #f3dfe5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        body {
            background-image: url("https://img.freepik.com/free-vector/hand-drawn-healthy-food-background_23-2148169733.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #fff8f4;
            color: var(--ink);
            padding: 24px 16px;
            max-width: 1180px;
            margin: 0 auto;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 244, 247, 0.91), rgba(245, 255, 250, 0.88)),
                rgba(255, 255, 255, 0.86);
            z-index: -1;
        }

        .page-header {
            background: linear-gradient(135deg, #ff9aa2 0%, #ffdac1 48%, #d7c0e8 100%);
            border-radius: 12px;
            padding: 30px 22px;
            box-shadow: 0 10px 28px rgba(229, 111, 134, 0.22);
            margin-bottom: 20px;
            color: #fff;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            line-height: 1.25;
        }

        .page-header p {
            font-size: 15px;
            opacity: 0.96;
            line-height: 1.7;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card,
        .content-card {
            background: var(--card);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(216, 163, 177, 0.13);
            border: 1px solid rgba(255, 218, 225, 0.82);
        }

        .stat-card {
            padding: 18px 14px;
            min-height: 132px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .stat-card i {
            font-size: 24px;
            margin-bottom: 9px;
            color: var(--rose-deep);
        }

        .stat-card .num {
            font-size: 23px;
            font-weight: 750;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .stat-card .text {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.45;
        }

        .stat-card.warning i,
        .stat-card.warning .num {
            color: #c46a4a;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }

        .content-card {
            padding: 22px;
        }

        .card-full {
            grid-column: 1 / -1;
        }

        .card-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.35;
        }

        .card-title i {
            color: var(--rose-deep);
            font-size: 18px;
        }

        .chart-wrap {
            width: 100%;
            height: 288px;
            position: relative;
        }

        .chart-wrap.tall {
            height: 330px;
        }

        .chart-fallback {
            display: none;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th {
            background: #fff0f4;
            color: #b64c67;
            padding: 13px 10px;
            text-align: left;
        }

        .data-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
            line-height: 1.55;
        }

        .data-table tr.today-row {
            background: #f4f1ff;
            font-weight: 550;
        }

        .data-table tr.low-row {
            background: #fff7d8;
        }

        .data-table tr.over-row {
            background: #fff0ec;
        }

        .risk-note {
            display: inline-block;
            margin-top: 4px;
            color: #b46b2d;
            font-size: 12px;
            font-weight: 700;
        }

        .ok-note {
            display: inline-block;
            margin-top: 4px;
            color: #4f9b7f;
            font-size: 12px;
            font-weight: 700;
        }

        .progress-box {
            margin: 14px 0;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 12px;
            background: #f6e8ee;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-inner {
            height: 100%;
            width: 71.5%;
            background: linear-gradient(90deg, #ffb3c1, #ff8fab);
            border-radius: 6px;
        }

        .progress-inner.weight {
            width: 70%;
            background: linear-gradient(90deg, #b5ead7, #7fd5be);
        }

        .progress-inner.time {
            width: 42.5%;
            background: linear-gradient(90deg, #fff4c7, #ffdac1);
        }

        .health-note {
            border-left: 4px solid var(--peach);
            background: #fff8ed;
            color: #6c4b3e;
            line-height: 1.75;
        }

        .data-note {
            border-left: 4px solid var(--sky);
            background: #f6f7ff;
            color: #4e5470;
            line-height: 1.75;
        }

        .movement-note {
            border-left: 4px solid var(--mint);
            background: #f4fff9;
            color: #3f6658
